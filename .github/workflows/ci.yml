# =============================================================================
# SALES PORTAL - CI Checks
# =============================================================================
# Runs lint, type check, unit tests, and E2E tests.
#   - PR into main or production: full gate (lint + types + unit + e2e).
#   - Push to dev:                light gate (lint + types + unit). e2e is PR-only.
# =============================================================================

name: CI

on:
  pull_request:
    branches:
      - main
      - production
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint and Type Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: pnpm typecheck

  # ---------------------------------------------------------------------------
  # Unit and Component Tests
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # E2E Tests
  # ---------------------------------------------------------------------------
  test-e2e:
    name: E2E Tests
    # e2e is the heavier gate, reserved for the PR into main (the prod gate).
    # Pushes to dev run the light lint/types/unit jobs only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://sonoralab.litium.portal:3000' }}
      E2E_EXPECTED_TENANT_ID: ${{ vars.E2E_EXPECTED_TENANT_ID || 'sonoralab' }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EXTERNAL_SERVER: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The target: an origin, the tenant it must resolve to, and a test
      # account. Repository variables/secrets override the committed defaults.
      # E2E_EXTERNAL_SERVER: the job starts the preview once (below) and runs
      # each preflight layer against it as its own step, so the step view
      # names the layer that broke; playwright.config.ts then starts nothing.
      - name: Point the target hostname at the runner
        run: echo "127.0.0.1 $(node -e 'console.log(new URL(process.env.PLAYWRIGHT_BASE_URL).hostname)')" | sudo tee -a /etc/hosts

      # The production build sets `upgrade-insecure-requests` and Secure auth
      # cookies, so it only works over https. NITRO_SSL_CERT / NITRO_SSL_KEY
      # hold PEM contents, not paths.
      - name: Generate TLS cert for the preview server
        run: ./infra/scripts/local-cert.sh

      - name: Cache Nuxt build
        uses: actions/cache@v4
        with:
          path: |
            .nuxt
            .output
          key: nuxt-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nuxt.config.ts', 'app/**', 'server/**', 'shared/**') }}

      - name: Build application
        run: pnpm build

      # Output goes to a file: an open stdout would keep the step from ending.
      - name: Start the preview server
        run: |
          NITRO_SSL_CERT="$(cat .certs/local.crt)" NITRO_SSL_KEY="$(cat .certs/local.key)" E2E=1 \
            pnpm preview > preview.log 2>&1 &

      - name: Preflight L0 · reachability
        run: pnpm test:e2e --no-deps --project "L0 reachability"

      - name: Preflight L1 · liveness
        run: pnpm test:e2e --no-deps --project "L1 liveness"

      - name: Preflight L2 · identity
        run: pnpm test:e2e --no-deps --project "L2 identity"

      - name: Preflight L3 · delivery
        run: pnpm test:e2e --no-deps --project "L3 delivery"

      - name: Preflight L4 · session
        run: pnpm test:e2e --no-deps --project "L4 session"

      - name: Run E2E smoke tests
        run: pnpm test:e2e --no-deps --project=chromium tests/e2e/app.spec.ts tests/e2e/homepage.spec.ts tests/e2e/csp-policy.spec.ts tests/e2e/unknown-hostname.spec.ts

      - name: Upload preview server log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-log
          path: preview.log
          retention-days: 7

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
