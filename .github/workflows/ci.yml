# =============================================================================
# SALES PORTAL - CI Checks
# =============================================================================
# Runs lint, format check, type check, unit tests, and E2E tests.
#   - PR into main or production: full gate (lint + format + types + unit + e2e).
#   - Push to dev:                light gate (lint + format + types + unit). e2e is PR-only.
# =============================================================================

name: CI

on:
  pull_request:
    branches:
      - main
      - production
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint, Format and Type Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run type check
        run: pnpm typecheck

      - name: Check the Playwright image tag
        run: pnpm check:playwright-image

  # ---------------------------------------------------------------------------
  # Unit and Component Tests
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # E2E Tests
  # ---------------------------------------------------------------------------
  # e2e is the heavier gate, reserved for the PR into main (the prod gate).
  # Pushes to dev run the light lint/types/unit jobs only.
  #
  # One build, then one job per browser project in parallel.

  e2e-build:
    name: E2E · build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Nuxt build
        uses: actions/cache@v6
        with:
          path: |
            .nuxt
            .output
          key: nuxt-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nuxt.config.ts', 'app/**', 'server/**', 'shared/**') }}

      - name: Build application
        run: pnpm build

      # A tarball, not the folder: `.output/server/node_modules` holds
      # directory symlinks, which upload-artifact does not keep, and the
      # folder is several thousand files where this is one.
      - name: Pack the build
        run: tar -czf e2e-build.tgz .output

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-build
          path: e2e-build.tgz
          retention-days: 1

  test-e2e:
    name: E2E · ${{ matrix.project }} · ${{ matrix.variant.name }}
    needs: e2e-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Provisional until measured: container start, ~1.3 min of fixed steps and
    # the slowest suite at ~9.6 min.
    timeout-minutes: 18
    # Playwright's image carries the browsers and their system libraries, so
    # no leg runs apt or downloads a browser. The tag must equal the locked
    # @playwright/test version; `pnpm check:playwright-image` in the lint job
    # fails when it does not. --ipc=host: Chromium runs out of shared memory on
    # Docker's default /dev/shm.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    strategy:
      # Each project is its own answer: a red webkit leaves chromium and
      # Mobile Chrome running to the end.
      fail-fast: false
      matrix:
        project: [chromium, Mobile Chrome, webkit]
        # Temporary: every worker setting on every project in one run, so the
        # step times compare under the same load on the merchant API.
        variant:
          - { name: w2, args: '--workers=2' }
          - { name: w100, args: '--workers=100%' }
          - { name: w150, args: '--workers=150%' }
          - { name: w100-fp, args: '--workers=100% --fully-parallel' }
        # `slug` names the artifacts, which should not carry a space.
        include:
          - project: chromium
            slug: chromium
          - project: Mobile Chrome
            slug: mobile-chrome
          - project: webkit
            slug: webkit
    env:
      # Empty repository variables fall through to the committed defaults in
      # tests/e2e/target-defaults.mjs, the one place the target is spelled out.
      PLAYWRIGHT_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_EXPECTED_TENANT_ID: ${{ vars.E2E_EXPECTED_TENANT_ID }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EXTERNAL_SERVER: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Temporary: what `--workers=100%` resolves against (Playwright reads
      # os.cpus()), next to what the container reports.
      - name: Print the core count
        run: |
          echo "nproc: $(nproc)"
          node -p '"os.cpus: " + require("os").cpus().length'

      # The target: an origin, the tenant it must resolve to, and a test
      # account. Repository variables/secrets override the committed defaults.
      # E2E_EXTERNAL_SERVER: the job starts the preview once (below) and runs
      # each preflight layer against it as its own step, so the step view
      # names the layer that broke; playwright.config.ts then starts nothing.
      # Hostname from the suite's resolver, not from the variable: with the
      # variable unset, `new URL('')` throws inside a command substitution,
      # which leaves the step green and writes a hosts line with no hostname.
      - name: Point the target hostname at the runner
        run: echo "127.0.0.1 $(node tests/e2e/target-defaults.mjs)" >> /etc/hosts

      # The production build sets `upgrade-insecure-requests` and Secure auth
      # cookies, so it only works over https. NITRO_SSL_CERT / NITRO_SSL_KEY
      # hold PEM contents, not paths.
      - name: Generate TLS cert for the preview server
        run: ./infra/scripts/local-cert.sh

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: e2e-build

      - name: Unpack the build
        run: tar -xzf e2e-build.tgz

      # Output goes to a file: an open stdout would keep the step from ending.
      # NUXT_CONFIGURATOR_BACKEND: the configurator suite runs against the
      # fixture; every other environment runs merchant-api.
      # The preload stops the server closing idle sockets under Playwright's
      # pooled API requests (tests/e2e/preview-keepalive.mjs). Absolute path:
      # `nuxt preview` starts the server with `.output` as its cwd.
      - name: Start the preview server
        run: |
          NITRO_SSL_CERT="$(cat .certs/local.crt)" NITRO_SSL_KEY="$(cat .certs/local.key)" E2E=1 \
            NUXT_CONFIGURATOR_BACKEND=fixture \
            NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--import=$PWD/tests/e2e/preview-keepalive.mjs" \
            pnpm preview > preview.log 2>&1 &

      # Every leg runs the five layers against its own server, L4's sign-in
      # included: the session file it writes is this leg's.
      - name: Preflight L0 · reachability
        run: pnpm test:e2e --no-deps --project "L0 reachability"

      - name: Preflight L1 · liveness
        run: pnpm test:e2e --no-deps --project "L1 liveness"

      - name: Preflight L2 · identity
        run: pnpm test:e2e --no-deps --project "L2 identity"

      - name: Preflight L3 · delivery
        run: pnpm test:e2e --no-deps --project "L3 delivery"

      - name: Preflight L4 · session
        run: pnpm test:e2e --no-deps --project "L4 session"

      # This leg's one browser project, every spec. `--no-deps` because the
      # preflight layers above already ran.
      - name: Project · ${{ matrix.project }}
        run: pnpm test:e2e --no-deps --project="${{ matrix.project }}" ${{ matrix.variant.args }}

      - name: Upload preview server log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-log-${{ matrix.slug }}-${{ matrix.variant.name }}
          path: preview.log
          retention-days: 7

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.slug }}-${{ matrix.variant.name }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.slug }}-${{ matrix.variant.name }}
          path: test-results/
          retention-days: 7
