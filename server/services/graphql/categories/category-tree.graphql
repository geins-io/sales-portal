# The whole category tree for one channel/language/market, flat.
#
# Both consumers — the breadcrumb walk and the sitemap — read this one query.
# Both build addresses from `canonicalUrl`; no consumer reads `alias` today, it
# is kept so the query stays stable. `order` is absent because neither consumer
# needs it, and on the largest tenant measured (1564 categories) the response is
# already 341 KiB.
query categoryTree($channelId: String, $languageId: String, $marketId: String) {
  categories(
    channelId: $channelId
    languageId: $languageId
    marketId: $marketId
  ) {
    categoryId
    parentCategoryId
    name
    alias
    canonicalUrl
  }
}
