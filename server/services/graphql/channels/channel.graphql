query channel($channelId: String) {
  channel(channelId: $channelId) {
    defaultMarketId
    bogusField
    markets {
      id
      defaultLanguageId
      alias
      virtual
      onlyDisplayInCheckout
      groupKey
      allowedLanguages {
        id
        name
        code
      }
      country {
        name
        code
      }
      currency {
        name
        code
      }
    }
  }
}
