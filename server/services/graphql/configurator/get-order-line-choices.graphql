# What each row was committed with, structured, for a replay. Fragments cannot
# recurse: sections are selected four levels deep and groups three, as the live
# document is.
query getOrderLineChoices(
  $publicOrderId: Guid!
  $channelId: String
  $languageId: String
  $marketId: String
) {
  getOrderPublic(
    publicOrderId: $publicOrderId
    channelId: $channelId
    languageId: $languageId
    marketId: $marketId
  ) {
    cart {
      items {
        product {
          productId
        }
        configuration {
          sections {
            ...CpqCommittedSectionFields
            sections {
              ...CpqCommittedSectionFields
              sections {
                ...CpqCommittedSectionFields
                sections {
                  ...CpqCommittedSectionFields
                }
              }
            }
          }
        }
      }
    }
  }
}
