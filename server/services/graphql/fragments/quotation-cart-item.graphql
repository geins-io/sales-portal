fragment QuotationCartItem on CartItemType {
  id
  skuId
  quantity
  unitPrice {
    sellingPriceIncVat
    sellingPriceIncVatFormatted
    sellingPriceExVat
    sellingPriceExVatFormatted
    vat
    currency {
      code
    }
  }
  totalPrice {
    sellingPriceIncVat
    sellingPriceIncVatFormatted
    sellingPriceExVat
    sellingPriceExVatFormatted
    vat
    currency {
      code
    }
  }
  product {
    productId
    alias
    name
    articleNumber
    productImages {
      fileName
      url
    }
  }
}
