query getCompanyOrders(
  $channelId: String
  $languageId: String
  $marketId: String
) {
  getCompanyOrders(
    channelId: $channelId
    languageId: $languageId
    marketId: $marketId
  ) {
    id
    publicId
    status
    currency
    createdAt
    customerId
    customerEmail
    billingAddress {
      firstName
      lastName
      company
    }
    cart {
      summary {
        total {
          sellingPriceIncVat
          sellingPriceIncVatFormatted
          sellingPriceExVat
          sellingPriceExVatFormatted
        }
      }
    }
  }
}
