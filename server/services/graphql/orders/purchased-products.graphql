query getCompanyOrdersForPurchasedProducts(
  $channelId: String
  $languageId: String
  $marketId: String
) {
  getCompanyOrders(
    channelId: $channelId
    languageId: $languageId
    marketId: $marketId
  ) {
    id
    publicId
    createdAt
    customerEmail
    billingAddress {
      firstName
      lastName
    }
    cart {
      items {
        quantity
        unitPrice {
          sellingPriceExVat
          sellingPriceExVatFormatted
        }
        product {
          # For the configurator seam only; neither reaches the response.
          productId
          type
          articleNumber
          name
          alias
          productImages {
            fileName
          }
        }
      }
    }
  }
}
