query getCompanyOrdersForPurchasedProducts(
  $channelId: String
  $languageId: String
  $marketId: String
) {
  getCompanyOrders(
    channelId: $channelId
    languageId: $languageId
    marketId: $marketId
  ) {
    id
    publicId
    createdAt
    customerEmail
    billingAddress {
      firstName
      lastName
    }
    cart {
      items {
        quantity
        unitPrice {
          sellingPriceExVat
          sellingPriceExVatFormatted
          sellingPriceIncVat
          sellingPriceIncVatFormatted
        }
        product {
          # For the catalogue lookup only; it does not reach the response.
          productId
          articleNumber
          name
          alias
        }
      }
    }
  }
}
