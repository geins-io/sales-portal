query product(
  $alias: String!
  $channelId: String
  $languageId: String
  $marketId: String
) {
  product(
    alias: $alias
    channelId: $channelId
    languageId: $languageId
    marketId: $marketId
  ) {
    productId
    type
    articleNumber
    alias
    canonicalUrl
    alternativeUrls {
      language
      culture
      country
      url
      channelId
    }
    name
    brand {
      name
      alias
      canonicalUrl
    }
    # Storefront ProductImageType exposes only fileName and tags (no per-image alt field).
    # Alt text is generated client-side from product name + position (see useProductImageAlt).
    productImages {
      fileName
    }
    primaryCategory {
      categoryId
      name
      alias
      canonicalUrl
    }
    # The breadcrumb ancestors. This is the closure of every assigned category
    # plus their ancestors, in no stable order, so it is walked by
    # parentCategoryId from primaryCategory — never read positionally.
    categories {
      categoryId
      parentCategoryId
      name
      canonicalUrl
    }
    unitPrice {
      ...Price
    }
    texts {
      text1
      text2
      text3
    }
    parameterGroups {
      name
      parameterGroupId
      parameters {
        # Both `label` and `name` are per-language fields in the Geins admin,
        # resolved against the languageId passed above — `name` is not a
        # technical key, it is localized too. `label` is the merchant's
        # display name and is left empty on most tenants, arriving as "" and
        # not null, so consumers prefer it but must fall through on empty
        # rather than on nullish.
        label
        name
        value
        show
        identifier
      }
    }
    skus {
      ...Sku
    }
    totalStock {
      ...Stock
    }
    variantDimensions {
      dimension
      value
      level
      label
    }
    meta {
      ...Meta
    }
    variantGroup {
      variants {
        variants {
          variants {
            ...Variant
          }
          ...Variant
        }
        ...Variant
      }
    }
    discountCampaigns {
      ...Campaign
    }
    lowestPrice {
      lowestPriceIncVat
      lowestPriceIncVatFormatted
      lowestPriceExVat
      lowestPriceExVatFormatted
      comparisonPriceIncVat
      comparisonPriceIncVatFormatted
      comparisonPriceExVat
      comparisonPriceExVatFormatted
      isDiscounted
      discountPercentage
    }
    discountType
    rating {
      score
      voteCount
    }
  }
}
