query product(
  $alias: String!
  $channelId: String
  $languageId: String
  $marketId: String
) {
  product(
    alias: $alias
    channelId: $channelId
    languageId: $languageId
    marketId: $marketId
  ) {
    productId
    articleNumber
    alias
    canonicalUrl
    alternativeUrls {
      language
      culture
      country
      url
      channelId
    }
    name
    brand {
      name
      alias
      canonicalUrl
    }
    # Storefront ProductImageType exposes only fileName and tags (no per-image alt field).
    # Alt text is generated client-side from product name + position (see useProductImageAlt).
    productImages {
      fileName
    }
    primaryCategory {
      categoryId
      name
      alias
      canonicalUrl
    }
    # The breadcrumb ancestors. This is the closure of every assigned category
    # plus their ancestors, in no stable order, so it is walked by
    # parentCategoryId from primaryCategory — never read positionally.
    categories {
      categoryId
      parentCategoryId
      name
      canonicalUrl
    }
    unitPrice {
      ...Price
    }
    texts {
      text1
      text2
      text3
    }
    parameterGroups {
      name
      parameterGroupId
      # `label` is the merchant's localized display name, resolved against
      # the languageId passed above; `name` is the technical PIM key and is
      # the same in every language. Consumers prefer label, fall back to name.
      #
      # Two neighbouring fields are deliberately NOT selected, both verified
      # against live data rather than assumed:
      #   description — returns a byte-identical copy of `value`, not prose.
      #                 Selecting it makes the spec table render a parameter's
      #                 value as its group's description.
      #   type        — queryable, but null on every parameter we have seen,
      #                 so it can't be used to tell media from plain specs.
      parameters {
        name
        label
        value
        show
        identifier
      }
    }
    # Physical measurements live on the product record, not among the
    # parameters, and the spec table renders them as their own group. Geins
    # stores dimensions in millimetres and weight in grams, and returns 0 for
    # "never set" rather than null — the component drops zero rows.
    weight
    dimensions {
      length
      width
      height
    }
    skus {
      ...Sku
    }
    totalStock {
      ...Stock
    }
    variantDimensions {
      dimension
      value
      level
      label
    }
    meta {
      ...Meta
    }
    variantGroup {
      variants {
        variants {
          variants {
            ...Variant
          }
          ...Variant
        }
        ...Variant
      }
    }
    discountCampaigns {
      ...Campaign
    }
    lowestPrice {
      lowestPriceIncVat
      lowestPriceIncVatFormatted
      lowestPriceExVat
      lowestPriceExVatFormatted
      comparisonPriceIncVat
      comparisonPriceIncVatFormatted
      comparisonPriceExVat
      comparisonPriceExVatFormatted
      isDiscounted
      discountPercentage
    }
    discountType
    rating {
      score
      voteCount
    }
  }
}
