query productsByIds(
  $filter: FilterInputType = null
  $take: Int = null
  $channelId: String
  $languageId: String
  $marketId: String
) {
  products(
    filter: $filter
    take: $take
    channelId: $channelId
    languageId: $languageId
    marketId: $marketId
  ) {
    products {
      productId
      alias
      canonicalUrl
      name
      articleNumber
      type
      # The purchased-products cards send a product with several SKUs to its page.
      skus {
        skuId
      }
      productImages {
        fileName
        url
      }
      # Without unitPrice Geins answers no products at all for a productIds
      # filter, with no error.
      unitPrice {
        sellingPriceIncVatFormatted
        sellingPriceExVatFormatted
      }
    }
    count
  }
}
