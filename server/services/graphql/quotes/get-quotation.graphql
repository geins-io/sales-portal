query getQuotationCart($quotationId: Guid!, $languageId: String) {
  getQuotationCart(quotationId: $quotationId, languageId: $languageId) {
    id
    items {
      ...QuotationCartItem
      ...QuotationLineConfiguration
    }
    summary {
      ...QuotationCartSummary
    }
    quotation {
      ...QuotationWithAddresses
      validPaymentMethods {
        paymentId
        name
        displayName
        paymentFee
      }
      orderPublicId
      orderDetails {
        customerOrderNumber
        customerReference
        desiredDeliveryDate
        goodsLabel
      }
      request {
        customerOrderNumber
        customerReference
        desiredDeliveryDate
        goodsLabel
      }
    }
  }
}
