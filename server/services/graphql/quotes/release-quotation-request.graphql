mutation releaseQuotationRequest($quotationId: Guid!, $languageId: String) {
  releaseQuotationRequest(quotationId: $quotationId, languageId: $languageId) {
    id
    items {
      ...QuotationCartItem
      ...QuotationLineConfiguration
    }
    summary {
      ...QuotationCartSummary
    }
    quotation {
      ...QuotationWithAddresses
    }
  }
}
