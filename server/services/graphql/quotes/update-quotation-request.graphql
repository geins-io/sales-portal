mutation updateQuotationRequest(
  $quotationId: Guid!
  $request: UpdateQuotationRequestInputType!
  $languageId: String
) {
  updateQuotationRequest(
    quotationId: $quotationId
    request: $request
    languageId: $languageId
  ) {
    id
    items {
      ...QuotationCartItem
      ...QuotationLineConfiguration
    }
    summary {
      ...QuotationCartSummary
    }
    quotation {
      ...QuotationWithAddresses
    }
  }
}
